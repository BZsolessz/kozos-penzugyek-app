<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Közös Pénzügyek 🍂</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-deep: #070c0b;
      --glass-bg: rgba(15, 25, 23, 0.82);
      --glass-border: rgba(251, 191, 36, 0.24);
      --amber: #f59e0b;
      --amber-light: #fcd34d;
      --emerald: #10b981;
      --emerald-light: #6ee7b7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 15% 8%, rgba(245, 158, 11, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 18%, rgba(16, 185, 129, 0.20) 0%, transparent 48%),
        radial-gradient(circle at 20% 85%, rgba(217, 119, 6, 0.16) 0%, transparent 50%),
        linear-gradient(165deg, #070c0b 0%, #0d1816 52%, #15110c 100%);
      background-attachment: fixed;
      padding: 12px 12px 52px 12px;
      overflow-x: hidden;
    }

    .container { max-width: 600px; margin: 0 auto; }

    /* Kulcskockás animációk */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.88); }
      70% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes leafFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(6deg); }
    }
    @keyframes toastBounce {
      0% { opacity: 0; transform: translate(-50%, 24px) scale(0.9); }
      70% { opacity: 1; transform: translate(-50%, -4px) scale(1.02); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 rgba(251, 191, 36, 0); }
      50% { box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4), 0 0 16px rgba(251, 191, 36, 0.12); }
    }
    @keyframes fillGrow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .page-animate {
      animation: fadeSlideUp 0.34s var(--smooth) both;
    }

    /* Kompakt mobilos felső app-sáv */
    .app-header {
      background: linear-gradient(135deg, rgba(17, 29, 26, 0.92), rgba(24, 19, 14, 0.90));
      border: 1px solid rgba(251, 191, 36, 0.28);
      border-radius: 20px;
      padding: 11px 14px;
      margin-bottom: 8px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: pulseGlow 5s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .app-brand { display: flex; align-items: center; gap: 10px; }
    .leaf-btn {
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      padding: 5px;
      border-radius: 12px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.25);
      animation: leafFloat 3.4s ease-in-out infinite;
      transition: transform 0.2s var(--spring), background 0.2s ease;
    }
    .leaf-btn:active {
      animation: none;
      transform: scale(1.26) rotate(22deg);
      background: rgba(251, 191, 36, 0.26);
    }
    .app-title { font-size: 1.02rem; font-weight: 700; color: #f8fafc; line-height: 1.2; }
    .app-date { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; }

    .balance-chip {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(52, 211, 153, 0.40);
      border-radius: 14px;
      padding: 6px 11px;
      text-align: right;
      cursor: pointer;
      transition: transform 0.2s var(--spring), box-shadow 0.2s ease, background 0.2s ease;
    }
    .balance-chip:active { transform: scale(0.94); }
    .balance-chip.neg {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(251, 191, 36, 0.42);
    }

      font-size: 0.60rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #
