name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repó
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Capacitor és ikonok generálása
        run: |
          npm install
          npx cap init "Közös Pénzügyek" "hu.bzsolessz.kozospenzugyek" --web-dir www
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#070c0b' --splashBackgroundColor '#070c0b'
          npx cap sync android

      - name: Debug APK fordítása
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: Kozos-Penzugyek-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
